<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132240" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Compressor / Turbine Ring Accent -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#EAB308" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.4" />
  
  <!-- Monogram AE -->
  <g filter="url(#shadow)">
    <!-- Letter A -->
    <path d="M19 46 L27 18 L33 18 L41 46 L35.5 46 L33.8 40 L26.2 40 L24.5 46 Z M27.4 35.5 L32.6 35.5 L30 25.5 Z" fill="url(#goldGrad)" />
    <!-- Letter E accent bar -->
    <path d="M38 23 L48 23 L48 27 L41.5 27 M38 31 L46 31 L46 35 L40.5 35 M38 39 L49 39 L49 43 L38 43" fill="#FFFFFF" />
  </g>
  
  <!-- Precision Engineering Dot -->
  <circle cx="48" cy="19" r="2.5" fill="#EAB308" />
</svg>
